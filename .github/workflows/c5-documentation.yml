name: C4 and C5 documentation

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - README.md
      - AGENTS.md
      - CLAUDE.md
      - docs/architecture/**
      - .agents/skills/c4-architecture/**
      - .agents/skills/architecture-decision-records/**
      - .agents/skills/grounded-vault/**
      - scripts/c5-documentation/**
      - .github/workflows/c5-documentation.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: c5-docs-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'main' }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install isolated diagram validation tools
        run: npm install --prefix "$RUNNER_TEMP/c5-mermaid" --no-save --package-lock=false mermaid@11.12.0 jsdom@26.1.0
      - name: Test documentation preparation and agent handoff
        env:
          C5_MERMAID_MODULES: ${{ runner.temp }}/c5-mermaid/node_modules
        run: python -m unittest discover -s scripts/c5-documentation -p 'test_*.py'
      - if: github.event_name == 'pull_request'
        run: |
          python docs/architecture/check_docs.py
          node scripts/c5-documentation/check_mermaid.mjs "$RUNNER_TEMP/c5-mermaid/node_modules"

  reconcile:
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    outputs:
      changed: ${{ steps.prepare.outputs.changed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Prepare exact-source evidence and the agent task
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
          TASK_REPOSITORY: ${{ github.repository }}
          TASK_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python scripts/c5-documentation/agent_job.py prepare \
            --target "$TARGET_SHA" --repository "$TASK_REPOSITORY" --run-url "$TASK_RUN_URL" \
            --context "$RUNNER_TEMP/c5-context.json" --prompt "$RUNNER_TEMP/c5-prompt.md" \
            --output "$GITHUB_OUTPUT" --skip-existing
      - name: Check model authentication
        if: steps.prepare.outputs.changed == 'true'
        env:
          DOCS_MODEL_KEY: ${{ secrets.CODEX_DOCS_API_KEY }}
        run: |
          if [ -z "$DOCS_MODEL_KEY" ]; then
            echo "::error::Add the GitHub Actions secret CODEX_DOCS_API_KEY with an OpenAI API key. This agent requires model access; application secrets are not needed."
            exit 1
          fi
      - name: Install isolated diagram validation tools
        if: steps.prepare.outputs.changed == 'true'
        run: npm install --prefix "$RUNNER_TEMP/c5-mermaid" --no-save --package-lock=false mermaid@11.12.0 jsdom@26.1.0
      - name: Reconcile architecture with a Codex agent
        if: steps.prepare.outputs.changed == 'true'
        uses: openai/codex-action@86365089eb2b84e0a8fb0717b304f8bdcb13b20e # reviewed 2026-10-01
        with:
          openai-api-key: ${{ secrets.CODEX_DOCS_API_KEY }}
          codex-version: '0.159.3'
          permission-profile: ':workspace'
          safety-strategy: drop-sudo
          allow-bots: true
          codex-home: ${{ runner.temp }}/c5-codex
          codex-args: '--ephemeral'
          prompt-file: ${{ runner.temp }}/c5-prompt.md
          output-schema-file: scripts/c5-documentation/agent-result.schema.json
          output-file: ${{ runner.temp }}/c5-agent-result.json
      - name: Validate the agent changes and export documentation only
        if: steps.prepare.outputs.changed == 'true'
        run: |
          python scripts/c5-documentation/agent_job.py finish \
            --context "$RUNNER_TEMP/c5-context.json" --result "$RUNNER_TEMP/c5-agent-result.json" \
            --modules "$RUNNER_TEMP/c5-mermaid/node_modules" --bundle "$RUNNER_TEMP/c5-agent-bundle.json"
      - name: Save the validated documentation handoff
        if: steps.prepare.outputs.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: c5-agent-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/c5-agent-bundle.json
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: reconcile
    if: needs.reconcile.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install isolated diagram validation tools
        run: npm install --prefix "$RUNNER_TEMP/c5-mermaid" --no-save --package-lock=false mermaid@11.12.0 jsdom@26.1.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: c5-agent-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/c5-agent-artifact
      - name: Independently validate the handoff in a fresh checkout
        env:
          TARGET_SHA: ${{ github.sha }}
          TASK_REPOSITORY: ${{ github.repository }}
          TASK_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python scripts/c5-documentation/agent_job.py restore \
            --bundle "$RUNNER_TEMP/c5-agent-artifact/c5-agent-bundle.json" \
            --target "$TARGET_SHA" --repository "$TASK_REPOSITORY" --run-url "$TASK_RUN_URL" \
            --modules "$RUNNER_TEMP/c5-mermaid/node_modules" --output "$RUNNER_TEMP/c5-update.json"
      - name: Publish a draft documentation PR
        env:
          GH_TOKEN: ${{ github.token }}
          TASK_REPOSITORY: ${{ github.repository }}
        run: python scripts/c5-documentation/publish.py "$RUNNER_TEMP/c5-update.json" "$TASK_REPOSITORY"
