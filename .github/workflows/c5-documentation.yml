name: C4 and C5 documentation

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - README.md
      - AGENTS.md
      - CLAUDE.md
      - docs/architecture/**
      - .agents/skills/c4-architecture/**
      - .agents/skills/architecture-decision-records/**
      - .agents/skills/grounded-vault/**
      - scripts/c5-documentation/**
      - .github/workflows/c5-documentation.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: c5-docs-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'main' }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts/c5-documentation -p 'test_*.py'
      - if: github.event_name == 'pull_request'
        run: python docs/architecture/check_docs.py

  reconcile:
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Compile change evidence and documentation status
        env:
          TARGET_SHA: ${{ github.sha }}
          TASK_REPOSITORY: ${{ github.repository }}
          TASK_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python scripts/c5-documentation/sync.py \
            --target "$TARGET_SHA" --repository "$TASK_REPOSITORY" \
            --run-url "$TASK_RUN_URL" --output "$RUNNER_TEMP/c5-update.json"
      - name: Publish a draft documentation PR
        env:
          GH_TOKEN: ${{ github.token }}
          TASK_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/c5-documentation/publish.py "$RUNNER_TEMP/c5-update.json" "$TASK_REPOSITORY"
